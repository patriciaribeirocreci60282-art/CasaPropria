
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff3b19">
  <meta name="description" content="Confira os detalhes deste imóvel em Agronômica, Florianópolis.">
  <title>Cartão de Imóvel</title>

  <style>
    :root {
      --marca-principal: #ff3b19;
      --marca-secundaria: #242424;
      --cor-texto: #333333;
      --cor-texto-secundario: #666666;
      --cor-borda: #e8e8e8;
      --cor-fundo: #ffffff;
      --raio-cartao: 12px;
      --sombra-cartao: 0 3px 12px rgba(0, 0, 0, 0.08);
      --sombra-cartao-hover: 0 8px 24px rgba(0, 0, 0, 0.14);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--cor-texto);
      background: #f7f7f7;
    }

    .property-card {
      width: 100%;
      max-width: 340px;
      min-width: 0;
      margin: 0 auto;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--cor-texto);
      background: var(--cor-fundo);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio-cartao);
      box-shadow: var(--sombra-cartao);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    @media (hover: hover) {
      .property-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--sombra-cartao-hover);
      }
    }

    .property-image-container {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
      background: #eeeeee;
    }

    .property-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease;
    }

    @media (hover: hover) {
      .property-card:hover .property-image {
        transform: scale(1.04);
      }
    }

    .property-tags {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      max-width: calc(100% - 28px);
    }

    .property-tag {
      display: inline-block;
      max-width: 100%;
      padding: 7px 11px;
      border-radius: 4px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .property-tag--sale {
      background: var(--marca-principal);
    }

    .property-tag--type {
      background: rgba(25, 25, 25, 0.88);
    }

    .property-price {
      position: absolute;
      right: 0;
      bottom: 15px;
      max-width: 95%;
      padding: 11px 15px;
      color: #ffffff;
      background: rgba(20, 20, 20, 0.9);
      border-radius: 5px 0 0 5px;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .property-content {
      padding: 20px 16px 16px;
    }

    .property-location {
      margin: 0 0 8px;
      color: var(--marca-principal);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .property-description {
      margin: 0 0 17px;
      color: var(--cor-texto-secundario);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .property-features {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding-top: 15px;
      border-top: 1px solid var(--cor-borda);
    }

    .property-feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      color: var(--cor-texto-secundario);
      font-size: 12px;
      text-align: center;
    }

    .property-feature-icon {
      font-size: 20px;
      line-height: 1;
    }

    .property-feature-value {
      max-width: 100%;
      color: var(--cor-texto);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .property-feature-label {
      font-size: 10px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .property-details-link {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 1px solid var(--marca-principal);
      border-radius: 5px;
      color: #ffffff;
      background: var(--marca-principal);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .property-details-link:hover {
      color: var(--marca-principal);
      background: #ffffff;
    }

    .property-details-link:focus-visible {
      outline: 3px solid var(--marca-principal);
      outline-offset: 3px;
    }

    .property-details-link:active {
      transform: scale(0.99);
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .property-image-container {
        height: 220px;
      }

      .property-content {
        padding: 16px 12px 12px;
      }

      .property-features {
        gap: 3px;
      }

      .property-feature {
        font-size: 11px;
      }

      .property-feature-icon {
        font-size: 18px;
      }

      .property-feature-label {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <article class="property-card" aria-labelledby="property-location">

      <div class="property-image-container">

        <!-- Substitua pelo caminho real da imagem do imóvel -->
        <img
          class="property-image"
          src="property-image.jpg"
          alt="Apartamento à venda em Agronômica, Florianópolis"
          loading="lazy"
          decoding="async"
        >

        <div class="property-tags" aria-label="Informações do imóvel">
          <span class="property-tag property-tag--sale">
            Venda
          </span>

          <span class="property-tag property-tag--type">
            Apartamento
          </span>
        </div>

        <div class="property-price" aria-label="Preço do imóvel">
          R$ 2.050.232,40
        </div>

      </div>

      <div class="property-content">

        <h2 class="property-location" id="property-location">
          Agronômica - Florianópolis
        </h2>

        <p class="property-description">
          Apartamento com ambientes amplos e ótima localização.
        </p>

        <div class="property-features" aria-label="Características do imóvel">

          <div class="property-feature">
            <span class="property-feature-icon" aria-hidden="true">
              📐
            </span>
            <span class="property-feature-value">156 m²</span>
            <span class="property-feature-label">Área</span>
          </div>

          <div class="property-feature">
            <span class="property-feature-icon" aria-hidden="true">
              🛏️
            </span>
            <span class="property-feature-value">3</span>
            <span class="property-feature-label">Quartos</span>
          </div>

          <div class="property-feature">
            <span class="property-feature-icon" aria-hidden="true">
              🛁
            </span>
            <span class="property-feature-value">1</span>
            <span class="property-feature-label">Banheiro</span>
          </div>

          <div class="property-feature">
            <span class="property-feature-icon" aria-hidden="true">
              🚗
            </span>
            <span class="property-feature-value">1</span>
            <span class="property-feature-label">Vaga</span>
          </div>

        </div>

        <!-- Substitua # pelo endereço real da página deste imóvel -->
        <a
          class="property-details-link"
          href="#"
          aria-label="Ver detalhes do apartamento em Agronômica, Florianópolis"
        >
          Ver detalhes do imóvel
        </a>

      </div>

    </article>
  </main>

</body>
</html>
