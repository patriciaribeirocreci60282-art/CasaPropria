
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão de Imóvel</title>

  <style>
    :root {
      /* Personalize com as cores oficiais da sua marca */
      --marca-principal: #ff3b19;
      --marca-secundaria: #242424;
      --cor-texto: #333333;
      --cor-texto-secundario: #666666;
      --cor-borda: #e8e8e8;
      --cor-fundo: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    .property-card {
      width: 100%;
      max-width: 340px;
      min-width: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--cor-texto);
      background: var(--cor-fundo);
      border: 1px solid var(--cor-borda);
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      transition: transform 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .property-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.13);
    }

    .property-image-container {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
      background: #eeeeee;
    }

    .property-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .property-card:hover .property-image {
      transform: scale(1.04);
    }

    .property-tags {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .property-tag {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 4px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .property-tag--sale {
      background: var(--marca-principal);
    }

    .property-tag--type {
      background: rgba(25, 25, 25, 0.86);
    }

    .property-price {
      position: absolute;
      right: 0;
      bottom: 15px;
      max-width: 95%;
      padding: 11px 15px;
      color: #ffffff;
      background: rgba(20, 20, 20, 0.88);
      border-radius: 4px 0 0 4px;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .property-content {
      padding: 20px 16px 16px;
    }

    .property-location {
      margin: 0 0 8px;
      color: var(--marca-principal);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .property-description {
      margin: 0 0 17px;
      color: var(--cor-texto-secundario);
      font-size: 13px;
      line-height: 1.5;
    }

    .property-features {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding-top: 15px;
      border-top: 1px solid var(--cor-borda);
    }

    .property-feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      color: var(--cor-texto-secundario);
      font-size: 12px;
      text-align: center;
    }

    .property-feature-icon {
      font-size: 20px;
      line-height: 1;
    }

    .property-feature-value {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .property-feature-label {
      font-size: 10px;
    }

    .property-details-link {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 1px solid var(--marca-principal);
      border-radius: 5px;
      color: #ffffff;
      background: var(--marca-principal);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s ease,
                  color 0.2s ease;
    }

    .property-details-link:hover {
      color: var(--marca-principal);
      background: #ffffff;
    }

    .property-details-link:focus-visible {
      outline: 3px solid var(--marca-principal);
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      .property-image-container {
        height: 220px;
      }

      .property-content {
        padding: 16px 12px 12px;
      }

      .property-features {
        gap: 3px;
      }

      .property-feature {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .property-card,
      .property-image,
      .property-details-link {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <article class="property-card">

    <div class="property-image-container">
      <!-- Preserve aqui o caminho real da imagem do sistema -->
      <img
        class="property-image"
        src="property-image.jpg"
        alt="Apartamento em Agronômica, Florianópolis"
        loading="lazy"
      >

      <div class="property-tags">
        <span class="property-tag property-tag--sale">
          Venda
        </span>

        <span class="property-tag property-tag--type">
          Apartamento
        </span>
      </div>

      <div class="property-price">
        R$ 2.050.232,40
      </div>
    </div>

    <div class="property-content">

      <h2 class="property-location">
        Agronômica - Florianópolis
      </h2>

      <p class="property-description">
        Apartamento com ambientes amplos e ótima localização.
      </p>

      <div class="property-features">

        <div class="property-feature">
          <span class="property-feature-icon" aria-hidden="true">
            📐
          </span>
          <span class="property-feature-value">156 m²</span>
          <span class="property-feature-label">Área</span>
        </div>

        <div class="property-feature">
          <span class="property-feature-icon" aria-hidden="true">
            🛏️
          </span>
          <span class="property-feature-value">3</span>
          <span class="property-feature-label">Quartos</span>
        </div>

        <div class="property-feature">
          <span class="property-feature-icon" aria-hidden="true">
            🛁
          </span>
          <span class="property-feature-value">1</span>
          <span class="property-feature-label">Banheiro</span>
        </div>

        <div class="property-feature">
          <span class="property-feature-icon" aria-hidden="true">
            🚗
          </span>
          <span class="property-feature-value">1</span>
          <span class="property-feature-label">Vaga</span>
        </div>

      </div>

      <!-- Troque # pelo destino real da página do imóvel -->
      <a class="property-details-link" href="#">
        Ver detalhes do imóvel
      </a>

    </div>
  </article>

</body>
</html>
