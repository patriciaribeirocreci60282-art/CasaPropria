<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Encontre seu imóvel, construa sua casa ou solicite uma simulação gratuita com Patricia Ribeiro.">
  <title>CasaPrópria | Patricia Ribeiro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --orange: #E8622A;
      --orange-dark: #C94C19;
      --ink: #262823;
      --muted: #625F59;
      --line: #E7E2DA;
      --cream: #F7F5F1;
      --white: #FFFFFF;
      --shadow: 0 16px 45px rgba(27,31,24,.14);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 20px;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }

    .container {
      width: min(1440px, calc(100% - 48px));
      margin-inline: auto;
    }

    /* CABEÇALHO */

    .header {
      position: relative;
      z-index: 20;
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 1;
    }

    .header .brand img.brand-logo {
      display: block;
      width: 45px !important;
      height: 45px !important;
      min-width: 45px !important;
      min-height: 45px !important;
      max-width: 45px !important;
      max-height: 45px !important;
      flex: 0 0 45px !important;
      object-fit: contain;
      object-position: center;
      background: transparent;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .brand-name {
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 600;
      letter-spacing: -.5px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(12px, 2vw, 28px);
    }

    .nav a,
    .nav button {
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav a:hover,
    .nav button:hover {
      color: var(--orange-dark);
    }

    .nav .nav-login {
      padding: 10px 18px;
      border-radius: 5px;
      background: var(--orange);
      color: white;
    }

    .nav .nav-login:hover {
      background: var(--orange-dark);
      color: white;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
    }

    .menu-toggle svg { width: 25px; height: 25px; }

    /* PÁGINAS INTERNAS */

    .internal-page {
      min-height: 65vh;
      padding: 58px 0 80px;
      background: var(--cream);
    }

    .internal-heading {
      max-width: 760px;
      margin: 0 auto 30px;
      text-align: center;
    }

    .internal-heading .section-kicker {
      display: block;
      margin-bottom: 8px;
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .internal-heading h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.2;
      letter-spacing: -.8px;
    }

    .internal-heading p {
      margin: 14px 0 0;
      color: var(--muted);
    }

    .form-card {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: clamp(20px, 4vw, 36px);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      box-shadow: 0 12px 36px rgba(0,0,0,.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 50px;
      padding: 12px;
      border: 1px solid #DCD7CF;
      border-radius: 5px;
      outline: none;
      color: var(--ink);
      background: white;
      font-size: 15px;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(232,98,42,.12);
    }

    .form-help {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .form-section-title {
      grid-column: 1 / -1;
      margin: 12px 0 -4px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
      font-weight: 700;
    }

    .standard-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .standard-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .standard-option:has(input:checked) {
      border-color: var(--orange);
      background: #FFF8F4;
    }

    .standard-option input {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin-top: 4px;
      accent-color: var(--orange);
    }

    .standard-option strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .standard-option span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .btn {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 22px;
      border: 0;
      border-radius: 5px;
      background: var(--orange);
      color: white;
      font-size: 15px;
      font-weight: 700;
      transition: background .2s ease;
    }

    .btn:hover { background: var(--orange-dark); }

    .btn-block {
      width: 100%;
      margin-top: 22px;
    }

    .form-note {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      margin-bottom: 25px;
      color: var(--orange-dark);
      font-size: 14px;
      font-weight: 700;
    }

    /* IMAGEM PRINCIPAL */

    .hero {
      position: relative;
      isolation: isolate;
      min-height: clamp(420px, 48vw, 650px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 110px;
      text-align: center;
      background: #454940;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2400&q=90");
      background-size: cover;
      background-position: center 55%;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        90deg,
        rgba(25,30,25,.65),
        rgba(25,30,25,.35),
        rgba(25,30,25,.42)
      );
    }

    .hero-content {
      width: 100%;
      max-width: 1250px;
      margin: auto;
    }

    .hero h1 {
      margin: 0;
      color: white;
      font-size: clamp(38px,5.5vw,72px);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -1.5px;
      text-shadow: 0 3px 24px rgba(0,0,0,.7);
    }

    .hero p {
      max-width: 680px;
      margin: 18px auto 0;
      color: white;
      font-size: clamp(15px, 2vw, 19px);
      text-shadow: 0 2px 12px rgba(0,0,0,.65);
    }

    /* BUSCA DE IMÓVEIS */

    .search-wrap {
      position: relative;
      z-index: 3;
      width: min(1200px, calc(100% - 48px));
      margin: -100px auto 0;
    }

    .search-panel {
      padding: 28px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 55px rgba(0,0,0,.18);
    }

    .search-title {
      margin: 0 0 22px;
      font-size: 20px;
      font-weight: 700;
    }

    .search-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr 1fr auto;
      gap: 15px;
      align-items: end;
    }

    .search-grid .field label { font-size: 13px; }

    .search-grid .field input,
    .search-grid .field select {
      height: 52px;
      padding: 0 12px;
      font-size: 14px;
    }

    .search-grid .btn { min-height: 52px; }

    .accent-strip {
      width: 100%;
      height: 10px;
      background: var(--orange);
    }

    /* SEÇÕES */

    .section { padding: 70px 0; }
    .section.soft { background: var(--cream); }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    .section-kicker {
      display: block;
      margin-bottom: 8px;
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .section h2 {
      margin: 0;
      font-size: clamp(27px,3vw,36px);
      font-weight: 600;
      line-height: 1.3;
    }

    .section-desc {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .text-link {
      color: var(--orange-dark);
      font-size: 14px;
      font-weight: 700;
    }

    .listing-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .results-count { color: var(--muted); font-size: 14px; }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .sort-control select {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: white;
      font-size: 14px;
    }

    /* IMÓVEIS */

    .property-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 24px;
    }

    .property-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      transition: box-shadow .2s ease, transform .2s ease;
    }

    .property-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .property-image {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #E8E4DD;
    }

    .property-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .property-placeholder {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 7px 11px;
      border-radius: 3px;
      background: white;
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 700;
    }

    .property-body { padding: 20px; }

    .property-type {
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .property-body h3 {
      margin: 8px 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
    }

    .location {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .property-features {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      font-size: 13px;
    }

    .property-price {
      margin: 18px 0;
      font-size: 21px;
      font-weight: 700;
    }

    .property-action {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .empty-state {
      padding: 30px 20px;
      border: 1px dashed #D8D0C6;
      border-radius: 8px;
      background: white;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 18px;
    }

    .status-message {
      margin: 20px 0;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    /* PÁGINA COMPLETA DE DETALHES DO IMÓVEL */

    .property-detail {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .detail-gallery {
      margin: 25px 0 35px;
    }

    .detail-main-photo {
      position: relative;
      width: 100%;
      height: clamp(300px, 55vw, 650px);
      overflow: hidden;
      border-radius: 12px;
      background: #E8E4DD;
    }

    .detail-main-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #242424;
    }

    .detail-price {
      margin-top: 15px;
      color: var(--orange-dark);
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 700;
    }

    .footer {
      padding: 35px 0;
      border-top: 1px solid var(--line);
      background: white;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer strong { font-size: 18px; font-weight: 600; }
    .footer p { margin: 6px 0; color: var(--muted); font-size: 13px; }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .footer-links a { font-size: 13px; font-weight: 600; }

    .whatsapp {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      padding: 12px 20px;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 50px;
      background: var(--orange);
      color: white;
      box-shadow: 0 8px 28px rgba(100,43,17,.28);
      font-size: 14px;
      font-weight: 700;
    }

    .whatsapp:hover { background: var(--orange-dark); }
    .whatsapp svg { width: 23px; height: 23px; flex: 0 0 23px; }

    @media (max-width: 1100px) {
      .search-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .search-grid .btn { width: 100%; }
      .property-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .section { padding: 55px 0; }
      .nav { gap: 14px; }
      .nav a, .nav button { font-size: 13px; }
    }

    @media (max-width: 760px) {
      .container { width: calc(100% - 28px); }
      .header-inner { min-height: 66px; gap: 8px; }
      .brand { gap: 7px; flex: 1; }
      .brand-name { font-size: 18px; }
      .brand-sub { font-size: 11px; }
      .menu-toggle { display: inline-flex; }
      .nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        padding: 12px 20px 20px;
        flex-direction: column;
        align-items: stretch;
        background: white;
        border-bottom: 1px solid var(--line);
        box-shadow: 0 12px 20px rgba(0,0,0,.08);
      }
      .nav.open { display: flex; }
      .nav a, .nav button {
        display: block;
        width: 100%;
        padding: 13px 8px;
        text-align: left;
      }
      .nav .nav-login { margin-top: 8px; padding: 12px; text-align: center; }
      .hero { min-height: 420px; padding: 50px 14px 95px; }
      .search-wrap { width: calc(100% - 28px); margin-top: -72px; }
      .search-panel { padding: 22px 16px; }
      .search-grid { grid-template-columns: 1fr; gap: 16px; }
      .property-grid { grid-template-columns: 1fr; gap: 20px; }
      .whatsapp { right: 12px; bottom: 12px; min-height: 50px; padding: 10px 15px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="#comprar" data-page="comprar" aria-label="Página inicial CasaPrópria">
        <img class="brand-logo" src="./Gemini_Generated_Image_9wawnj9wawnj9waw-removebg-preview%20(1).png" alt="Logo CasaPrópria" width="45" height="45">
        <span class="brand-text">
          <span class="brand-name">Patricia Ribeiro</span>
          <span class="brand-sub">Corretora de Imóveis</span>
        </span>
      </a>

      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mainNav">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <nav class="nav" id="mainNav" aria-label="Navegação principal">
        <a href="#comprar" data-page="comprar">COMPRAR</a>
        <a href="#construir" data-page="construir">CONSTRUIR</a>
        <a href="#financiamento" data-page="financiamento">FINANCIAMENTO CAIXA</a>
        <a href="#vender" data-page="vender">VENDER MEU IMÓVEL</a>
        <a href="admin.html" class="nav-login">ENTRAR</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- PÁGINA PRINCIPAL: COMPRAR -->
    <div id="pageComprar">
      <section class="hero" aria-label="Encontre seu imóvel">
        <div class="hero-content">
          <h1>Encontre seu imóvel</h1>
          <p>O lugar ideal para começar uma nova história pode estar aqui.</p>
        </div>
      </section>

      <div class="search-wrap">
        <form class="search-panel" id="searchForm">
          <h2 class="search-title">Encontre o imóvel ideal para você</h2>
          <div class="search-grid">
            <div class="field">
              <label for="location">Cidade ou bairro</label>
              <input id="location" type="search" placeholder="Ex.: Criciúma, Içara..." autocomplete="off">
            </div>
            <div class="field">
